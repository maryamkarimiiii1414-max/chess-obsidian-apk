name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create Cordova Project
        run: |
          cordova create build ir.username.chessgame "Chess"
          cd build
          cordova platform add android
      - name: Add Tapsell Plugin
        run: |
          cd build
          cordova plugin add tapsell-v3-cordova-plugin
      - name: Copy Game Files
        run: |
          rm -rf build/www/*
          cp index.html build/www/index.html
          cp manifest.webmanifest build/www/ 2>/dev/null || true
          cp icon-192.png build/www/ 2>/dev/null || true
          cp sw.js build/www/ 2>/dev/null || true
      - name: Build APK
        run: |
          cd build
          cordova build android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: build/platforms/android/app/build/outputs/apk/**/*.apk
