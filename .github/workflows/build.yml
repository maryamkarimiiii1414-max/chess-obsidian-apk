- name: Build
        shell: bash
        run: |
          mkdir -p www
          cp chess-obsidian-gold-final.html www/index.html
          cordova platform add android@12.0.1
          cordova plugin add tapsell-v3-cordova-plugin
          sed -i 's/(TapsellAdActivity)(cordova.getActivity())/(TapsellAdActivity)((android.app.Activity) cordova.getActivity())/g' platforms/android/app/src/main/java/ir/tapsell/sdk/TapsellCordovaInterface.java
          cordova build android --debug 2>&1 | tee build.log
