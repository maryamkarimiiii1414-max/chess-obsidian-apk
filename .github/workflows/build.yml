name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: npm install -g cordova
      - name: Build
        shell: bash
        run: |
          mkdir -p www
          cp chess-obsidian-gold-final.html www/index.html
          cordova platform add android@12.0.1
          cordova plugin add tapsell-v3-cordova-plugin
          cordova build android --debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: grep -n -A4 -E "error:|What went wrong|Could not|FAILED" build.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
